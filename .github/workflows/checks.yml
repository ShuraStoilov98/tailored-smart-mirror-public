name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python tools/check_docs.py
      - run: python -m compileall -q src tests tools
      - run: python -m pip install bandit==1.9.4 detect-secrets==1.5.0 pip-audit==2.10.1
      - run: bandit -r src tests/scripts
      - run: python tools/audit_privacy.py
      - run: pip-audit -r requirements-hardware.lock --progress-spinner off
